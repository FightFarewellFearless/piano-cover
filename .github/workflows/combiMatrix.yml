name: Combi Matrix
on:
  workflow_dispatch:

jobs:
  # ==============================================================================
  # JOB 1: PRE-PROCESSING (Audio Separator)
  # ==============================================================================
  prepare_stems:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Checkout own repo
        uses: actions/checkout@v4
        with:
          path: my

      - name: Install FFmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Audio Separator
        run: |
          pip install "audio-separator[cpu]"
          pip cache purge

      - name: Run Audio Separator
        run: |
          mkdir audiosep_output
          audio-separator ./my/music.mp3 \
            --output_format=MP3 \
            --output_dir audiosep_output \
            --model_filename model_bs_roformer_ep_317_sdr_12.9755.ckpt \
            --custom_output_names='{"Vocals": "vocals_output", "Drums": "drums_output", "Instrumental": "instrumental_output", "Bass": "bass_output"}'

      - name: Upload Stems Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stems-output
          path: audiosep_output

  # ==============================================================================
  # JOB 2: PROCESSING (MATRIX)
  # Keduanya sekarang menggunakan AMT, hanya beda input file
  # ==============================================================================
  generate:
    needs: prepare_stems
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: [music2midi, amt] # music2midi = Vocals, amt = Instrumental

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install FFmpeg & Timidity
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg timidity

      # Checkout repo sendiri untuk script cleaning
      - name: Checkout own repo
        uses: actions/checkout@v4
        with:
          path: my

      # Checkout repo AMT
      - name: Checkout AMT
        uses: actions/checkout@v4
        with:
          repository: misya11p/amt-apc
          path: amt

      - name: Download Stems
        uses: actions/download-artifact@v4
        with:
          name: stems-output
          path: audiosep_output

      # ------------------------------------------------------------------
      # SETUP LINGKUNGAN (SAMA UNTUK KEDUANYA)
      # ------------------------------------------------------------------
      - name: Install Dependencies (Torch & AMT Requirements)
        run: |
          # Install Dependencies Heavy (Torch)
          pip install torch torchaudio torchcodec soundfile pretty-midi tqdm yt-dlp mido
          pip cache purge

      - name: Download Model & SoundFont
        working-directory: ./amt/
        run: |
          wget -P models/params/ https://github.com/misya11p/amt-apc/releases/download/beta/apc.pth
          echo "Mendownload SoundFont Piano..."
          wget https://keymusician01.s3.amazonaws.com/FluidR3_GM.zip
          unzip FluidR3_GM.zip

      # ------------------------------------------------------------------
      # PROSES INFERENCE (BEDAKAN INPUT & STYLE BERDASARKAN MATRIX)
      # ------------------------------------------------------------------
      - name: Run AMT Inference
        working-directory: ./amt/
        run: |
          # Default kosong
          EXTRA_FLAGS=""

          # Logika If/Else
          if [ "${{ matrix.model }}" == "music2midi" ]; then
            INPUT_FILE="../audiosep_output/vocals_output.mp3"
            EXTRA_FLAGS="--style level1"
            echo "Processing VOCALS with AMT (Style: Level 1)..."
          else
            INPUT_FILE="../audiosep_output/instrumental_output.mp3"
            echo "Processing INSTRUMENTAL with AMT..."
          fi
          
          # Jalankan Inference (Variabel EXTRA_FLAGS akan otomatis masuk jika ada isinya)
          python -m infer "$INPUT_FILE" $EXTRA_FLAGS

      # ------------------------------------------------------------------
      # KHUSUS VOCAL (Music2Midi): CLEANING
      # Kita rapikan hasil MIDI vokal agar tidak terlalu berantakan
      # ------------------------------------------------------------------
      - name: Clean Vocal MIDI (Only for music2midi)
        if: matrix.model == 'music2midi'
        run: |
          # Pindahkan output mentah AMT ke folder my untuk diproses cleaning
          mv ./amt/output.mid ./my/raw_vocal.mid
          
          # Jalankan script clean_piano.py Anda
          python ./my/clean_piano.py ./my/raw_vocal.mid ./my/midi.mid
          
          # Render audio dari MIDI yang SUDAH DIBERSIHKAN
          timidity ./my/midi.mid --force-program=0 -x "soundfont ./amt/FluidR3_GM.sf2" -Ow -o - | \
          ffmpeg -i - -af loudnorm -c:a libmp3lame -q:a 2 "./my/audio.mp3"

      # ------------------------------------------------------------------
      # KHUSUS INSTRUMENTAL (AMT): RENDER LANGSUNG
      # ------------------------------------------------------------------
      - name: Process Instrumental Output (Only for amt)
        if: matrix.model == 'amt'
        working-directory: ./amt/
        run: |
          # Render audio dari MIDI mentah AMT (Instrumental biasanya tidak perlu cleaning seagresif vokal)
          timidity output.mid -x "soundfont FluidR3_GM.sf2" -Ow -o - | \
          ffmpeg -i - -af loudnorm -c:a libmp3lame -q:a 2 "output.mp3"

      # ------------------------------------------------------------------
      # UPLOAD HASIL
      # ------------------------------------------------------------------
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ matrix.model }}
          path: |
            my/midi.mid
            my/audio.mp3
            amt/output.mid
            amt/output.mp3
          if-no-files-found: ignore

  # ==============================================================================
  # JOB 3: COMBINE (Post-Processing)
  # ==============================================================================
  finalize:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg & Timidity
        run: sudo apt-get update && sudo apt-get install -y ffmpeg timidity
      
      - name: Checkout own repo
        uses: actions/checkout@v4
        with:
          path: my
          
      # Ambil Hasil Vocals (yang sudah diproses cleaning)
      - name: Download Vocals Output
        uses: actions/download-artifact@v4
        with:
          name: output-music2midi
          path: music2midi

      # Ambil Hasil Instrumental
      - name: Download AMT Output
        uses: actions/download-artifact@v4
        with:
          name: output-amt
          path: amt_result

      # Gabungkan
      - name: Combine Audio Outputs
        run: |
          pip install pretty_midi mido
          
          # Input Vocal: dari folder music2midi/my/midi.mid
          # Input Instrumen: dari folder amt_result/amt/output.mid
          
          python ./my/mergemidi.py --vocal ./music2midi/my/midi.mid --instr ./amt_result/amt/output.mid --max_poly 5
          
          echo "Mendownload SoundFont Piano..."
          wget https://keymusician01.s3.amazonaws.com/FluidR3_GM.zip
          unzip FluidR3_GM.zip
          
          # Render MIDI gabungan
          timidity final_clean.mid --force-program=1 -x "soundfont FluidR3_GM.sf2" -Ow -o - | \
          ffmpeg -i - -af loudnorm -c:a libmp3lame -q:a 2 "final_combined_output.mp3"

      - name: Final Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Final-Combined-Output
          path: |
            final_clean.mid
            final_combined_output.mp3
