name: amt
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Install System Dependencies (REQUIRED for MP3 decoding)
      - name: install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: misya11p/amt-apc
          path: amt

      - name: Checkout own repo
        uses: actions/checkout@v4
        with:
          path: my

      - name: Cache Virtual Environment
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-venv-1
          restore-keys: |
            ${{ runner.os }}-venv-

      - name: install deps
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          source .venv/bin/activate
          # Added torchcodec to the list
          pip install torch torchaudio torchcodec soundfile pretty-midi tqdm yt-dlp

      - name: downloading model
        run: |
          wget -P amt/models/params/ https://github.com/misya11p/amt-apc/releases/download/beta/apc.pth

      - name: Add venv to PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
      
      - name: executing
        working-directory: ./amt/
        run: |
          # No 'source' needed because we added .venv/bin to GITHUB_PATH
          python -m infer -s level3 https://youtube.com/watch?v=pyDCubgU57g
          # ../my/music.mp3

      - name: Upload Piano Results
        uses: actions/upload-artifact@v4
        with:
          name: converted-midi-and-audio
          path: amt/output.mid
