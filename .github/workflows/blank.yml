name: test
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Install System Dependencies
      - name: install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y fluidsynth ffmpeg

      # 2. Checkout Repo Musik2Midi (Hanya untuk ambil environment.yaml)
      - name: Checkout music2midi (external)
        uses: actions/checkout@v4
        with:
          repository: ytinyui/music2midi
          path: music2midi_deps  # Diletakkan di folder khusus

      # 3. Checkout Repo Anda Sendiri (Tempat piano.py berada)
      - name: Checkout own repo
        uses: actions/checkout@v4
        with:
          path: my_project       # Diletakkan di folder berbeda agar tidak bentrok

      - name: Setup Micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: music2midi_deps/environment.yaml
          environment-name: music2midi
          cache-environment: true # Di sini fitur ini VALID dan bekerja sangat baik
          cache-downloads: true

      # 5. Download Model (Masukkan ke dalam folder repo Anda agar terbaca piano.py)
      - name: downloading model
        run: |
          wget -O my_project/model.ckpt https://github.com/ytinyui/music2midi/releases/download/0.1.0/epoch.799-step.119200.ckpt

      # 6. Eksekusi skrip di dalam folder repo Anda
      - name: Run script
        shell: bash -el {0}
        working-directory: ./my_project # Pindah ke folder repo Anda
        run: |
          python piano.py
